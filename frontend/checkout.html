<html lang="en">

<head>

    <meta charset="UTF-8">

    <style>
        .header {
            position: fixed;

        }


        .form_box {
            width: 85%;
            margin: 30px auto;
        }

        .card {
            margin-bottom: 50px;
            ;
        }

        .nav {
            margin-top: 20px;
            list-style: none;
            display: flex;
            gap: 24px;
            margin-left: 70%;

        }

        .nav li {
            background: #2563eb;

            border: none;
            cursor: pointer;
            padding: 10px 10px;
            border-radius: 8px;
            border: 1px solid #2563eb;

        }

        .nav li a {
            color: white;

        }

        .nav li:hover {
            /* text-decoration: underline; */
            background: #1e4fd8;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f0f2f5 url("background.png") fixed center/cover;
            display: flex;

<body>
    <div class="header">
        <h3>Quản lý bãi xe</h3>

        <ul class="nav">

            <li><a href="main.html">Trang chủ</a></li>
            <li><a href="login.html">Đăng xuất</a></li>
        </ul>
    </div>
    <div class="container">
        <div class="navbar">
            <h2>GHI NHẬN XE RA</h2>
        </div>
        <div class="form_box">
            <div class="search">
                <input type="text" id="maVe" placeholder="Nhập mã vé">
                <button onclick="timXe()">Tìm kiếm</button>
            </div>

            <div class="row">
                <<label>Biển số/Số cuối</label>
                    <input id="soCuoiHienThi" readonly> ```
                    <label>Loại xe</label>
                    <input id="loaiXe" readonly>
                    <label>Thời gian vào</label>
                    <input type="datetime-local" id="vao" readonly>
                    <label>Thời gian ra</label>
                    <input type="datetime-local" id="ra" onchange="tinhTien()">
                    <label>Tiền gửi</label>
                    <input id="tien" readonly>
            </div>
            <div id="reader" style="width: 300px; margin: 10px auto;"></div>
            <button onclick="startScanner()">Bật Camera quét mã</button>
        </div>
        <div class="button">
            <button onclick="ghiNhan()">Ghi nhận xe ra</button>
        </div>


        <script>
            // Biến lưu trữ VeXeId tạm thời để lát nữa dùng cho lúc xác nhận ra
            let currentVeXeId = null;

            async function timXe() {
                // Thêm đoạn này vào trong hàm timXe() sau khi nhận data thành công
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('ra').value = now.toISOString().slice(0, 16);

                // Sau khi set giá trị cho ô ra, gọi hàm tính tiền luôn
                tinhTien();
                const maVe = document.getElementById('maVe').value; // Sửa từ maVeRa -> maVe
                if (!maVe) return alert("Vui lòng nhập mã vé!");

                try {
                    const response = await fetch(`/api/xera/${maVe}`);
                    const data = await response.json();

                    if (response.ok) {
                        // Lưu VeXeId vào biến toàn cục để dùng cho hàm ghiNhan
                        currentVeXeId = data.VeXeId;

                        // Điền dữ liệu vào form
                        // Sửa trong hàm timXe()
                        document.getElementById('soCuoiHienThi').value = data.BienSo || data.SoCuoi;
                        document.getElementById('loaiXe').value = data.MauXe;
                        document.getElementById('vao').value = data.ThoiGianVao.slice(0, 16);

                        tinhTien(); // Tự tính tiền khi tìm thấy xe
                    } else {

                        alert(data.message);

                    }

                } catch (err) {
                    alert("Lỗi kết nối tới Server!");
                }

            }

            function tinhTien() {
                const vaoInput = document.getElementById('vao').value;
                const raInput = document.getElementById('ra').value;

                // Kiểm tra nếu chưa nhập thời gian ra thì dừng lại
                if (!raInput) return;

                const vao = new Date(vaoInput);
                const ra = new Date(raInput);

                // Kiểm tra xem date có hợp lệ không
                if (isNaN(vao.getTime()) || isNaN(ra.getTime())) {
                    document.getElementById('tien').value = "0 đ";
                    return;
                }

                // Tính chênh lệch giờ
                let diffMs = ra - vao;
                // Đảm bảo không âm (trường hợp giờ ra < giờ vào)
                let diffHrs = Math.max(1, Math.ceil(diffMs / (1000 * 60 * 60)));

                const loaiXe = document.getElementById('loaiXe').value;
                const giaMoiGio = (loaiXe === "Ô tô") ? 20000 : 5000;

                document.getElementById('tien').value = (diffHrs * giaMoiGio).toLocaleString('vi-VN') + " đ";
            }

            async function ghiNhan() {
                if (!currentVeXeId) return alert("Vui lòng tìm kiếm xe trước!");

                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ VeXeId: currentVeXeId }) // Gửi ID đúng cho server
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.message);
                    location.reload(); // Làm mới trang sau khi thành công
                } else {
                    alert("Lỗi: " + result.message);
                }
            }
            function startScanner() {
                const html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", { fps: 10, qrbox: 250 });

                html5QrcodeScanner.render((decodedText) => {
                    // decodedText chính là mã vé được quét từ camera
                    document.getElementById('maVe').value = decodedText;

                    // Tự động tìm xe luôn
                    timXe();

                    // Tắt camera sau khi quét xong để đỡ tốn tài nguyên
                    html5QrcodeScanner.clear();
                });
            }
        </script>
