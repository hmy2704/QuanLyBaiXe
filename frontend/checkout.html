<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ghi nhận xe ra</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(90deg, #6c7ae0, #a7b5f0);
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4e66b3;
            color: white;
            border: none;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>GHI NHẬN XE RA</h2>

        <div class="search">
            <input type="text" id="maVe" placeholder="Nhập mã vé">
            <button onclick="timXe()">Tìm kiếm</button>
        </div>

        <label>Biển số xe</label>
        <input id="bienSo" readonly>

        <label>Loại xe</label>
        <input id="loaiXe" readonly>

        <label>Thời gian vào</label>
        <input type="datetime-local" id="vao" readonly>

        <label>Thời gian ra</label>
        <input type="datetime-local" id="ra" onchange="tinhTien()">

        <label>Số giờ</label>
        <input id="gio" readonly>

        <label>Tiền</label>
        <input id="tien" readonly>

        <button onclick="ghiNhan()">Ghi nhận xe ra</button>


        <script>
            // tìm kiếm theo mã vé
            async function timXe() {

                let maVe = document.getElementById("maVe").value;

                let res = await fetch("http://localhost:3000/api/xera/" + maVe);

                let data = await res.json();

                document.getElementById("bienSo").value = data.BienSo;
                document.getElementById("loaiXe").value = data.TenLoaiXe;

                document.getElementById("vao").value =
                    new Date(data.ThoiGianVao).toISOString().slice(0, 16);

            }

            // tính tiền tự động 
            function tinhTien() {

                let vao = new Date(document.getElementById("vao").value);
                let ra = new Date(document.getElementById("ra").value);

                let hours = (ra - vao) / (1000 * 60 * 60);

                let gio = Math.ceil(hours);

                let tien = gio * 5000;

                document.getElementById("gio").value = gio;

                document.getElementById("tien").value =
                    tien.toLocaleString() + " VND";

            }
        </script>
    </div>



</body>

</html>
