            <h2>GHI NHẬN XE RA</h2>
        </div>
        <div class="form_box">
            <div class="search">
                <input type="text" id="maVe" placeholder="Nhập mã vé">

                <input id="soCuoiHienThi" readonly>
                <label>Loại xe</label>
                <input id="loaiXe" readonly>
                <label>Thời gian vào</label>
                <input type="datetime-local" id="vao" readonly>
                <label>Thời gian ra</label>
                <input type="datetime-local" id="ra" onchange="tinhTien()">
                <label>Tiền gửi</label>
                <input id="tien" readonly>
            </div>
            <div id="reader" style="width: 300px; margin: 10px auto;"></div>
            <button onclick="startScanner()" style="background-color: #28a745; margin-bottom: 10px;">Bật Camera quét mã</button>
            <button onclick="ghiNhan()">Ghi nhận xe ra</button>
        </div>
    </div>

    <script>
        let currentVeXeId = null;
        // ĐỊNH NGHĨA PORT CỦA BACKEND Ở ĐÂY (VÍ DỤ 3000)
        const BASE_URL = "http://localhost:3000";

        async function timXe() {
            const maVe = document.getElementById('maVe').value;
            if (!maVe) return alert("Vui lòng nhập mã vé!");

            // Tự động điền thời gian ra là hiện tại
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('ra').value = now.toISOString().slice(0, 16);

            try {
                // Sửa lỗi 404 bằng cách gọi đúng URL của Backend
                const response = await fetch(`${BASE_URL}/api/xera/${maVe}`);
                const data = await response.json();

                if (response.ok) {
                    currentVeXeId = data.VeXeId;
                    document.getElementById('soCuoiHienThi').value = data.BienSo || data.SoCuoi || "N/A";
                    document.getElementById('loaiXe').value = data.MauXe || data.LoaiXe || "N/A";
                    
                    if(data.ThoiGianVao) {
                        document.getElementById('vao').value = data.ThoiGianVao.slice(0, 16);
                    }

                    tinhTien();
                } else {
                    alert(data.message || "Không tìm thấy thông tin xe!");
                }
            } catch (err) {
                console.error(err);
                alert("Lỗi kết nối tới Server Backend (Hãy kiểm tra server đã chạy chưa và CORS đã bật chưa)!");
            }
        }

        function tinhTien() {
            const vaoInput = document.getElementById('vao').value;
            const raInput = document.getElementById('ra').value;

            if (!vaoInput || !raInput) return;

            const vao = new Date(vaoInput);
            const ra = new Date(raInput);

            if (isNaN(vao.getTime()) || isNaN(ra.getTime())) {
                document.getElementById('tien').value = "0 đ";
                return;
            }

            let diffMs = ra - vao;
            // Tính số giờ, tối thiểu là 1 giờ
            let diffHrs = Math.max(1, Math.ceil(diffMs / (1000 * 60 * 60)));

            const loaiXe = document.getElementById('loaiXe').value;
            // Giá tiền: Ô tô 20k, các xe khác 5k
            const giaMoiGio = (loaiXe === "Ô tô") ? 20000 : 5000;

            document.getElementById('tien').value = (diffHrs * giaMoiGio).toLocaleString('vi-VN') + " đ";
        }

        async function ghiNhan() {
            if (!currentVeXeId) return alert("Vui lòng tìm kiếm xe trước!");

            try {
                const response = await fetch(`${BASE_URL}/api/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ VeXeId: currentVeXeId })
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Thanh toán và ghi nhận xe ra thành công!");
                    location.reload();
                } else {
                    alert("Lỗi: " + (result.message || "Không thể thực hiện ghi nhận"));
                }
            } catch (err) {
                alert("Lỗi kết nối tới Server khi ghi nhận!");
            }
        }

        function startScanner() {
            const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((decodedText) => {
                document.getElementById('maVe').value = decodedText;
                timXe();
                html5QrcodeScanner.clear();
            });
        }
    </script>
