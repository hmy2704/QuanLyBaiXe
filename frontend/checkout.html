<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ghi nhận xe ra</title>
    <style>
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;

            background: #4873c9;
            padding: 14px 24px;
            color: white;
            z-index: 1000;
        }


        .form_box {
            width: 85%;
            margin: 30px auto;
        }

        .card {
            margin-bottom: 50px;
            ;
        }

        .nav {
            margin-top: 20px;
            list-style: none;
            display: flex;
            gap: 24px;
            margin-left: 70%;

        }

        .nav li {
            background: #2563eb;

            border: none;
            cursor: pointer;
            padding: 10px 10px;
            border-radius: 8px;
            border: 1px solid #2563eb;
            font-size: 14px;
        }

        .nav li a {
            color: white;
            text-decoration: none;

        }

        .nav li:hover {
            /* text-decoration: underline; */
            background: #1e4fd8;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f0f2f5 url("background.png") fixed center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            width: 400px;

            background: white;
            padding-bottom: 20px;
            margin-top: 140px;
            border-radius: 10px;
        }

        .navbar {
            background: #5b74b8;
            color: white;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            padding: 12px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;


        }

        .row {
            margin-right: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }


        button {
            width: 100%;
            padding: 10px;
            background: #4e66b3;
            color: white;
            border: none;
            border-radius: 7px;
        }

        .button {
            margin: 0px 25px 0px 30px;
        }

        .search {
            display: flex;
            gap: 10px;
            margin: 10px;

        }
    </style>
</head>

<body>
    <div class="header">
        <h3>Quản lý bãi xe</h3>

        <ul class="nav">

            <li><a href="main.html">Trang chủ</a></li>
            <li><a href="login.html">Đăng xuất</a></li>
        </ul>
    </div>
    <div class="container">
        <div class="navbar">
            <h2>GHI NHẬN XE RA</h2>
        </div>
        <div class="form_box">
            <div class="search">
                <input type="text" id="maVe" placeholder="Nhập mã vé">
                <button onclick="timXe()">Tìm kiếm</button>
            </div>
            <div class="row">
                <label>Biển số xe</label>
                <input id="bienSo" readonly>

                <label>Loại xe</label>
                <input id="loaiXe" readonly>

                <label>Thời gian vào</label>
                <input type="datetime-local" id="vao" readonly>

                <label>Thời gian ra</label>
                <input type="datetime-local" id="ra" onchange="tinhTien()">

                <label>Trạng thái thanh toán</label>
                <input id="trangThai" readonly>
            </div>
        </div>
        <div class="button">
            <button onclick="ghiNhan()">Ghi nhận xe ra</button>
        </div>
        <script src="env.js"></script>



        <script>

            // tìm xe theo VeXeId
            async function timXe() {

                let veXeId = document.getElementById("maVe").value;

                if (!veXeId) {
                    alert("Vui lòng nhập mã vé!");
                    return;
                }

                try {

                    let res = await fetch(`${API_BASE_URL}/xera/${veXeId}`);

                    if (!res.ok) {
                        alert("Không tìm thấy xe trong bãi!");
                        return;
                    }

                    let data = await res.json();

                    // hiển thị thông tin
                    document.getElementById("bienSo").value = data.BienSo || "";
                    document.getElementById("loaiXe").value = data.MauXe || "";

                    // trạng thái thanh toán
                    if (data.TrangThaiThanhToan == 1) {
                        document.getElementById("trangThai").value = "Đã thanh toán";
                    } else {
                        document.getElementById("trangThai").value = "Chưa thanh toán";
                    }


                } catch (err) {

                    console.log(err);
                    alert("Không kết nối được server!");

                }
            }



            // tính tiền tự động
            function tinhTien() {

                let vao = new Date(document.getElementById("vao").value);
                let ra = new Date(document.getElementById("ra").value);

                let gio = (ra - vao) / (1000 * 60 * 60);

                if (gio < 1) gio = 1;

                let loaiXe = document.getElementById("loaiXe").value;

                let tien = 0;

                if (loaiXe.toLowerCase().includes("ô tô")) {
                    tien = gio * 20000;
                } else {
                    tien = gio * 5000;
                }

                document.getElementById("tien").value =
                    Math.round(tien).toLocaleString() + " VND";

            }

            // ghi nhận xe ra
            async function ghiNhan() {

                let veXeId = document.getElementById("maVe").value;
                let thoiGianRa = document.getElementById("ra").value;
                let phiGui = document.getElementById("tien").value.replace(/\D/g, '');

                if (!veXeId) {
                    alert("Vui lòng nhập mã vé!");
                    return;
                }

                try {

                    let res = await fetch(`${API_BASE_URL}/checkout`, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            VeXeId: veXeId,
                            ThoiGianRa: thoiGianRa,
                            PhiGui: phiGui
                        })

                    });

                    let data = await res.json();

                    if (data.status === "OK") {

                        alert("Xe ra thành công!");

                        location.reload();

                    } else {

                        alert(data.message);

                    }

                } catch (err) {

                    console.log(err);
                    alert("Lỗi khi ghi nhận xe ra!");

                }

            }

        </script>
    </div>

</body>

</html>
