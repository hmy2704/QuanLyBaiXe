<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điều Khiển - Hệ thống Quản lý Bãi Xe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1E88E5;
            --bg-light: #f4f7f9;
            --text-dark: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-container {
            background: rgba(255, 255, 255, 0.95);
            width: 900px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary-blue);
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-welcome {
            background: #E3F2FD;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            color: #1565C0;
            font-weight: 600;
        }

        /* Lưới các nút chức năng */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .menu-item {
            background: white;
            border: 2px solid #eef2f7;
            padding: 25px 15px;
            border-radius: 15px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .menu-item i {
            font-size: 2.5rem;
            color: var(--primary-blue);
            margin-bottom: 15px;
        }

        .menu-item span {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary-blue);
            box-shadow: 0 10px 20px rgba(30, 136, 229, 0.15);
            background: #f8fbff;
        }

        /* Nút đăng xuất đặc biệt */
        .btn-logout {
            margin-top: 40px;
            padding: 12px 30px;
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #d32f2f;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.3);
        }

        /* Ẩn nút admin mặc định */
        .admin-only {
            display: none;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Hệ thống Quản lý Bãi Xe</h1>
            <div id="displayUser" class="user-welcome">
                <i class="fas fa-user-circle"></i> Xin chào, <span id="usernameVal">...</span>
            </div>
        </div>

        <div class="menu-grid">
            <a href="xevao.html" class="menu-item">
                <i class="fas fa-sign-in-alt"></i>
                <span>Ghi Nhận Xe Vào</span>
            </a>

            <a href="checkout.html" class="menu-item">
                <i class="fas fa-sign-out-alt"></i>
                <span>Ghi Nhận Xe Ra</span>
            </a>

            <a href="vethang.html" class="menu-item">
                <i class="fas fa-ticket-alt"></i>
                <span>Vé Tháng</span>
            </a>

            <a href="nhanvien.html" class="menu-item admin-only">
                <i class="fas fa-users-cog"></i>
                <span>Quản Lý Nhân Viên</span>
            </a>

            <a href="baocao.html" class="menu-item">
                <i class="fas fa-chart-bar"></i>
                <span>Báo Cáo Thống Kê</span>
            </a>


        </div>

        <button class="btn-logout" id="btnLogout">
            <i class="fas fa-power-off"></i> ĐĂNG XUẤT
        </button>
    </div>

    <script>
        // 1. Kiểm tra đăng nhập
        const user = localStorage.getItem('username');
        const role = localStorage.getItem('role');

        if (!user) {
            alert("Bạn cần đăng nhập để truy cập!");
            window.location.href = 'login.html';
        }

        // 2. Hiển thị thông tin
        document.getElementById('usernameVal').innerText = user;

        // 3. Phân quyền Admin (Dùng role từ Database trả về)
        if (role === 'admin' || role === 'Admin') {
            const adminButtons = document.querySelectorAll('.admin-only');
            adminButtons.forEach(btn => {
                btn.style.display = 'flex'; // Hiện theo kiểu flex của menu-item
            });
        }

        // 4. Logic Đăng xuất
        document.getElementById('btnLogout').addEventListener('click', function () {
            if (confirm("Bạn có chắc chắn muốn rời khỏi hệ thống?")) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        });
    </script>
</body>

</html>
