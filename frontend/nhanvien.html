<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống - Quản lý nhân sự</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1E88E5;
            --success: #28a745;
            --danger: #e53935;
            --bg-glass: rgba(255, 255, 255, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            background: rgba(30, 136, 229, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 40px;
            box-sizing: border-box;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-home {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-home:hover { background: white; color: var(--primary); }

        .main-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px 0;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Form thêm mới - Chỉ hiện cho Admin */
        .admin-panel {
            background: var(--bg-glass);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .input-box label { font-weight: 600; color: #444; font-size: 14px; }

        input, select {
            height: 42px;
            padding: 0 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        .btn-add {
            background: var(--success);
            color: white;
            border: none;
            height: 42px;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-add:hover { background: #218838; transform: translateY(-2px); }

        /* Table Style */
        .table-card {
            background: var(--bg-glass);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: left;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #333;
            font-size: 15px;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(30, 136, 229, 0.05); }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-admin { background: #fff3cd; color: #856404; }
        .badge-staff { background: #d1ecf1; color: #0c5460; }

        .btn-delete {
            background: #fff5f5;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-delete:hover { background: var(--danger); color: white; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div style="font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-users-cog"></i> QUẢN LÝ NHÂN SỰ
        </div>
        <a href="main.html" class="btn-home"><i class="fas fa-home"></i> Trang chủ</a>
    </div>

    <div class="main-container">
        <div id="divThem" class="admin-panel" style="display:none;">
            <div style="width: 100%; font-weight: bold; color: var(--primary); font-size: 1.1rem; margin-bottom: 10px;">
                <i class="fas fa-user-plus"></i> Thêm nhân viên mới
            </div>
            <div class="input-box">
                <label>Họ và tên</label>
                <input type="text" id="hoTen" placeholder="Nhập tên nhân viên...">
            </div>
            <div class="input-box">
                <label>Số điện thoại</label>
                <input type="text" id="sdt" placeholder="Nhập số điện thoại...">
            </div>
            <div class="input-box">
                <label>Phân quyền chức vụ</label>
                <select id="chucVu">
                    <option value="Nhân viên">Nhân viên</option>
                    <option value="Quản lý">Quản lý</option>
                </select>
            </div>
            <button class="btn-add" onclick="themNV()">
                <i class="fas fa-save"></i> LƯU NHÂN VIÊN
            </button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th>Họ tên</th>
                        <th>Số điện thoại</th>
                        <th>Chức vụ</th>
                        <th class="admin-only" style="display:none; text-align: center;">Hành động</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="env.js"></script>
    <script>
        const role = (localStorage.getItem('role') || "").trim();

        async function loadNhanVien() {
            try {
                const res = await fetch(`${API_BASE_URL}/nhanvien`);
                const data = await res.json();
                const body = document.getElementById('tableBody');
                body.innerHTML = '';

                if (Array.isArray(data)) {
                    data.forEach(nv => {
                        const badgeClass = nv.ChucVu === 'Quản lý' ? 'badge-admin' : 'badge-staff';
                        
                        body.innerHTML += `
                            <tr>
                                <td><b>#${nv.NhanVienId}</b></td>
                                <td style="font-weight: 600;">${nv.HoTen}</td>
                                <td>${nv.SoDienThoai}</td>
                                <td><span class="badge ${badgeClass}">${nv.ChucVu}</span></td>
                                <td class="admin-only" style="display: ${role === 'Admin' ? 'table-cell' : 'none'}; text-align: center;">
                                    <button class="btn-delete" onclick="xoaNV(${nv.NhanVienId})">
                                        <i class="fas fa-trash-alt"></i> Xóa
                                    </button>
                                </td>
                            </tr>`;
                    });
                }
            } catch (err) { console.error("Lỗi tải dữ liệu:", err); }

            // Hiển thị chức năng Admin
            if (role === 'Admin') {
                document.getElementById('divThem').style.display = 'flex';
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'table-cell');
            }
        }

        async function themNV() {
            const hoTen = document.getElementById('hoTen').value;
            const sdt = document.getElementById('sdt').value;
            const chucVu = document.getElementById('chucVu').value;

            if (!hoTen || !sdt) return alert("Vui lòng nhập đủ thông tin!");

            try {
                const res = await fetch(`${API_BASE_URL}/nhanvien`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-role': role
                    },
                    body: JSON.stringify({ HoTen: hoTen, SoDienThoai: sdt, ChucVu: chucVu })
                });

                if (res.ok) {
                    alert("Thêm nhân viên thành công!");
                    document.getElementById('hoTen').value = '';
                    document.getElementById('sdt').value = '';
                    loadNhanVien();
                } else {
                    alert("Lỗi: Bạn không có quyền hoặc dữ liệu sai.");
                }
            } catch (err) { alert("Lỗi kết nối server!"); }
        }

        async function xoaNV(id) {
            if (!confirm("Bạn có chắc chắn muốn xóa nhân viên này?")) return;
            
            try {
                const res = await fetch(`${API_BASE_URL}/nhanvien/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-user-role': role }
                });
                if (res.ok) loadNhanVien();
                else alert("Xóa thất bại!");
            } catch (err) { alert("Lỗi kết nối!"); }
        }

        loadNhanVien();
    </script>
</body>
</html>
