<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi nhận xe vào</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #f0f2f5 url("background.png") fixed center/cover; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: 'Poppins', sans-serif; 
        }
        .navbar { 
            width: 100%; 
            background: #3366CC; 
            display: flex; 
            justify-content: space-between; 
            padding: 10px 30px; 
            box-sizing: border-box; 
            color: white; 
            position: sticky; 
            top: 0; 
        }
        .nav-buttons { display: flex; gap: 10px; }
        .btn-nav { 
            padding: 8px 15px; 
            border-radius: 5px; 
            border: 1px solid white; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-xera { background: #ff9800; }
        .btn-baocao { background: #4CAF50; }
        .btn-thoat { background: #f44336; }
        .container { 
            display: flex; 
            gap: 20px; 
            padding: 40px; 
        }
        .giaodien, .danh-sach-container { 
            background: #DCDCDC; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            overflow: hidden; 
        }
        .giaodien { width: 400px; }
        .danh-sach-container { width: 550px; background: white; padding: 20px; }
        #ghi, th { background: #3366CC; color: white; padding: 15px; font-weight: bold; text-align: center; }
        .form-content { padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 10px; border: 1px solid #ddd; }
        input, select { 
            width: 100%; 
            height: 35px; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            padding: 5px; 
        }
        .btn-main { 
            width: 100%; 
            padding: 12px; 
            background: #3366CC; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 15px; 
        }
        .btn-save { 
            background: #4CAF50; 
            display: none; 
            float: right; 
            margin-top: 10px; 
            width: auto; 
            padding: 10px 30px; 
        }
        .user-info { margin-top: 20px; padding: 10px 30px; background: #DCDCDC; border-radius: 20px; font-weight: bold; color: #3366CC; }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="font-weight: bold">QUẢN LÝ BÃI XE</div>
        <div class="nav-buttons">
            <button class="btn-nav btn-xera" onclick="location.href='checkout.html'">Xe ra</button>
            <button class="btn-nav btn-baocao" onclick="location.href='baocao.html'">Báo cáo</button>
            <button class="btn-nav btn-thoat" onclick="thoat()">Thoát</button>
        </div>
    </div>

    <div class="container">
        <div class="giaodien">
            <div id="ghi">GHI NHẬN XE VÀO</div>
            <div class="form-content">
                <table>
                    <tr><td>Biển số</td><td><input type="text" id="bienSo"></td></tr>
                    <tr><td>Mã vé</td><td><input type="text" id="maVe"></td></tr>
                    <tr><td>Loại xe</td><td><select id="loaiXe"><option>Xe máy</option><option>Ô tô</option></select></td></tr>
                    <tr><td>Loại vé</td><td><select id="loaiVe"><option>Vé ngày</option><option>Vé tháng</option></select></td></tr>
                    <tr><td>Giờ vào</td><td><input type="datetime-local" id="tgVao"></td></tr>
                </table>
                <button class="btn-main" onclick="ghiNhan()">Ghi nhận (Enter)</button>
            </div>
        </div>

        <div class="danh-sach-container">
            <div style="color:#003399; font-weight: bold; margin-bottom: 10px;">Xe vừa vào bãi</div>
            <table id="tableDanhSach">
                <thead><tr><th>Biển số</th><th>Loại xe</th><th>Mã vé</th><th>Thời gian</th></tr></thead>
                <tbody></tbody>
            </table>
            <button id="btnSave" class="btn-main btn-save" onclick="saveToDB()">Lưu vào Database</button>
        </div>
    </div>

    <div class="user-info">NV: Phùng Ngọc Châu</div>

    <script>
        const $ = id => document.getElementById(id);
        
        function setTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            $('tgVao').value = now.toISOString().slice(0, 16);
        }

        function ghiNhan() {
            if (!$('bienSo').value || !$('maVe').value) return alert("Thiếu dữ liệu!");
            
            const row = $('tableDanhSach').tBodies[0].insertRow(0);
            row.innerHTML = `<td><b>${$('bienSo').value}</b></td><td>${$('loaiXe').value}</td><td>${$('maVe').value}</td><td>${$('tgVao').value.replace('T',' ')}</td>`;
            
            $('btnSave').style.display = "block";
            $('bienSo').value = ''; $('maVe').value = '';
            $('bienSo').focus(); setTime();
        }

        async function saveToDB() {
            // Đây là nơi bạn kết nối với file database (PHP, Nodejs hoặc API)
            const data = {
                bienSo: $('bienSo').value,
                maVe: $('maVe').value,
                // Lấy thêm dữ liệu từ bảng nếu cần lưu nhiều xe cùng lúc
            };

            alert("Đã gửi lệnh lưu vào database!");
            // Code mẫu: fetch('save.php', { method: 'POST', body: JSON.stringify(data) });
        }

        window.onload = () => { setTime(); $('bienSo').focus(); };
        document.onkeypress = e => e.key === 'Enter' && ghiNhan();
        function thoat() { if(confirm("Thoát?")) location.href="main.html"; }
    </script>
</body>
</html>
