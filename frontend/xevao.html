<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi nhận xe vào</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url("background.png");
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Times New Roman", Times, serif;
        }

        .navbar {
            width: 100%;
            background: #4A76C5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            box-sizing: border-box;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-nav {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            background: #2E69F2;
            font-family: inherit;
            font-size: 16px;
        }

        .btn-nav:hover {
            background: #1e56d4;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            padding: 40px;
            max-width: 1300px;
            width: 95%;
            justify-content: center;
        }

        .giaodien,
        .danh-sach-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .giaodien {
            width: 400px;
            flex-shrink: 0;
        }

        .danh-sach-container {
            flex-grow: 1;
            padding: 20px;
            min-width: 600px;
        }

        #ghi,
        th {
            background: #4A76C5;
            color: white;
            padding: 12px;
            font-weight: bold;
            text-align: center;
        }

        .form-content {
            padding: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td,
        th {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        input,
        select {
            width: 100%;
            height: 38px;
            border: 1px solid #aaa;
            padding: 5px 10px;
            font-family: inherit;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: #4A76C5;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-family: inherit;
            font-size: 16px;
            border-radius: 4px;
        }

        .btn-main:hover {
            background: #3a5fa3;
        }

        .btn-save {
            background: #28a745;
            display: none;
            float: right;
            width: auto;
            padding: 10px 30px;
            margin-top: 15px;
        }

        .fee-text {
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div style="font-weight: bold; font-size: 24px;">Quản lý bãi xe</div>
        <div class="nav-buttons">
            <button class="btn-nav" onclick="location.href='main.html'">Trang chủ</button>
            <button class="btn-nav" onclick="location.href='checkout.html'">Xe ra</button>
            <button class="btn-nav" onclick="location.href='baocao.html'">Báo cáo</button>
            <button class="btn-nav" onclick="thoat()">Đăng xuất</button>
        </div>
    </div>

    <div class="container">
        <div class="giaodien">
            <div id="ghi">GHI NHẬN XE VÀO</div>
            <div class="form-content">
                <table>
                    <tr>
                        <td style="text-align: left;">Biển số</td>
                        <td><input type="text" id="bienSo" autofocus placeholder="Nhập biển số..."></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;">Loại xe</td>
                        <td>
                            <select id="loaiXe">
                                <option value="Xe máy">Xe máy (5.000đ)</option>
                                <option value="Ô tô">Ô tô (20.000đ)</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left;">Giờ vào</td>
                        <td><input type="datetime-local" id="tgVao"></td>
                    </tr>
                </table>
                <button class="btn-main" onclick="ghiNhan()">Ghi nhận (Enter)</button>
            </div>
        </div>

        <div class="danh-sach-container">
            <div
                style="color:#4A76C5; font-weight: bold; margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #4A76C5; padding-bottom: 5px; text-align: left;">
                Danh sách xe chờ lưu
            </div>
            <table id="tableDanhSach">
                <thead>
                    <tr>
                        <th>Biển số</th>
                        <th>Loại xe</th>
                        <th>Thời gian</th>
                        <th>Tiền phí</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="btnSave" class="btn-main btn-save" onclick="saveToDB()">Lưu tất cả vào Database</button>
        </div>
    </div>

    <script src="env.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        let danhSachXeChoLuu = [];

        function setTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            $('tgVao').value = now.toISOString().slice(0, 16);
        }

        function ghiNhan() {
            const bs = $('bienSo').value.trim();
            const lx = $('loaiXe').value;

            // Chỉ kiểm tra biển số, không cần kiểm tra maVe nữa
            if (!bs) {
                alert("Vui lòng nhập Biển số!");
                return;
            }

            // Đẩy dữ liệu vào danh sách (Không cần maVe)
            danhSachXeChoLuu.push({
                bienSo: bs,
                mauXe: lx
            });

            let phi = (lx === "Ô tô") ? 20000 : 5000;

            // Cập nhật bảng hiển thị
            const tbody = $('tableDanhSach').tBodies[0];
            const row = tbody.insertRow(0);

            // Lưu ý: Đã xóa cột "Mã vé" để khớp với yêu cầu tự động cấp vé
            row.innerHTML = `
        <td style="font-weight:bold">${bs}</td>
        <td>${lx}</td>
        <td>${$('tgVao').value.replace('T', ' ')}</td>
        <td class="fee-text">${phi.toLocaleString('vi-VN')} đ</td>
    `;

            // Hiện nút Lưu
            $('btnSave').style.display = "block";

            // Xóa input để nhập xe tiếp theo
            $('bienSo').value = '';
            $('bienSo').focus();
            setTime();
        }

        async function saveToDB() {
            if (danhSachXeChoLuu.length === 0) return alert("Chưa có xe nào!");
            const API_URL = "http://localhost:3000/api/checkin";

            for (const xe of danhSachXeChoLuu) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(xe)
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        alert(`Lỗi xe ${xe.bienSo}: ${result.message}`);
                        return;
                    }
                } catch (err) {
                    alert("Lỗi kết nối Server!");
                    return;
                }
            }
            alert("Lưu database thành công!");
            danhSachXeChoLuu = [];
            $('tableDanhSach').tBodies[0].innerHTML = '';
            $('btnSave').style.display = "none";
        }

        window.onload = () => { setTime(); $('bienSo').focus(); }
        document.onkeypress = e => { if (e.key === 'Enter') ghiNhan(); }
        function thoat() { if (confirm("Bạn muốn đăng xuất?")) location.href = "login.html"; }
    </script>
</body>

</html>
