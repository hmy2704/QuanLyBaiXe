<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Ghi nhận xe vào</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url("background.png");
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Times New Roman", Times, serif;
        }

        .navbar {
            width: 100%;
            background: #4A76C5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            box-sizing: border-box;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-nav {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            background: #2E69F2;
            font-family: inherit;
            font-size: 16px;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            padding: 40px;
            max-width: 1300px;
            width: 95%;
            justify-content: center;
        }

        .giaodien,
        .danh-sach-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .giaodien {
            width: 420px;
            flex-shrink: 0;
        }

        .danh-sach-container {
            flex-grow: 1;
            padding: 20px;
            min-width: 600px;
        }

        #ghi,
        th {
            background: #4A76C5;
            color: white;
            padding: 12px;
            font-weight: bold;
            text-align: center;
        }

        .form-content {
            padding: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td,
        th {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        input,
        select {
            width: 100%;
            height: 38px;
            border: 1px solid #aaa;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: #4A76C5;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 4px;
        }

        #webcam {
            border-radius: 8px;
            border: 2px solid #ddd;
            margin-bottom: 10px;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div style="font-weight: bold; font-size: 24px;">Quản lý bãi xe</div>
        <div class="nav-buttons">
            <button class="btn-nav" onclick="location.href='main.html'">Trang chủ</button>
            <button class="btn-nav" onclick="location.href='checkout.html'">Xe ra</button>
            <button class="btn-nav" onclick="location.href='baocao.html'">Báo cáo</button>
            <button class="btn-nav" onclick="thoat()">Đăng xuất</button>
        </div>
    </div>

    <div class="container">
        <div class="giaodien">
            <div id="ghi">GHI NHẬN XE VÀO</div>
            <div class="form-content">
                <video id="webcam" autoplay></video>
                <canvas id="canvas" style="display:none;"></canvas>

                <button class="btn-main" id="btnScan" onclick="quetBienSo()" style="background: #28a745;"> Quét biển
                    số tự động</button>

                <div style="margin-top: 15px;">
                    <label>Biển số nhận diện:</label>
                    <input type="text" id="bienSoInput" placeholder="Kết quả AI sẽ hiện ở đây">
                </div>

                <table style="margin-top: 15px;">
                    <tr>
                        <td>Loại xe</td>
                        <td>
                            <select id="loaiXe">
                                <option value="Xe máy">Xe máy</option>
                                <option value="Ô tô">Ô tô</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left;">Giờ vào</td>
                        <td><input type="datetime-local" id="tgVao"></td>
                    </tr>
                    <div class="input-group">
                        <label>Mã thẻ (Quét thẻ vé tháng):</label>
                        <input type="text" id="maVeInput" placeholder="Để trống nếu là khách vãng lai">
                    </div>
                </table>
                <button class="btn-main" onclick="ghiNhan()">Ghi nhận xe vào</button>
                <div id="qrCode"></div>
            </div>
        </div>

        <div class="danh-sach-container">
            <div
                style="color:#4A76C5; font-weight: bold; margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #4A76C5; padding-bottom: 5px;">
                Danh sách xe chờ lưu
            </div>
            <table id="tableDanhSach">
                <thead>
                    <tr>
                        <th>Biển số</th>
                        <th>Loại xe</th>
                        <th>Thời gian</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="btnSave" class="btn-main" style="background: #28a745; display:none;" onclick="saveToDB()">Lưu
                tất cả vào Database</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const bienSoInput = document.getElementById('bienSoInput');

        // 1. Mở Webcam
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                alert("Không thể mở camera. Vui lòng kiểm tra quyền truy cập!");
            }
        }

        // 2. Nhận diện biển số
        async function quetBienSo() {
            const btn = document.getElementById('btnScan');
            btn.innerText = "Đang nhận diện...";
            btn.disabled = true;

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');

                try {
                    const response = await fetch('http://localhost:5001/ocr', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    if (data.bien_so) {
                        bienSoInput.value = data.bien_so;
                    } else {
                        alert("Không đọc được biển số, thử lại nhé!");
                    }
                } catch (error) {
                    alert("Lỗi kết nối Python! Hãy bật file detect_plate.py (Port 5001)");
                } finally {
                    btn.innerText = "Quét biển số tự động";
                    btn.disabled = false;
                }
            }, 'image/jpeg');
        }

        // 3. Logic Ghi nhận tạm (My có thể sửa lại theo ý nhóm)

        async function ghiNhan() {
            const bs = document.getElementById('bienSoInput').value;
            const lx = document.getElementById('loaiXe').value;
            const mv = document.getElementById('maVeInput').value; // <--- Lấy mã thẻ nhân viên quét

            if (!bs) return alert("Chưa có biển số xe!");

            try {
                const res = await fetch('/api/checkin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bienSo: bs,
                        loaiXe: lx,
                        maVeQuet: mv // <--- Gửi mã thẻ kèm theo (nếu có)
                    })
                });

                const data = await res.json();

                if (data.success) {
                    // Nếu là vé tháng, hiện thông báo chào mừng khác biệt
                    if (data.loaiKhach === "Vé tháng") {
                        alert("CHÀO KHÁCH VÉ THÁNG: " + data.maVe);
                    } else {
                        alert("Cấp vé vãng lai: " + data.maVe);
                        // Nếu có mã QR thì gọi hàm hiện QR ở đây
                    }

                    // Xóa sạch mã thẻ sau khi quẹt xong để sẵn sàng cho xe tiếp theo
                    document.getElementById('maVeInput').value = "";
                    // Tự động load lại danh sách xe trong bãi (nếu My có hàm load)
                    if (typeof loadTable === "function") loadTable();

                } else {
                    alert("Lỗi: " + data.message);
                }
            } catch (err) {
                console.error(err);
                alert("Lỗi kết nối Server!");
            }
        }
        window.onload = startWebcam;
    </script>
</body>

</html>
