<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Ghi nhận xe vào</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url("background.png");
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Times New Roman", Times, serif;
        }

        .navbar {
            width: 100%;
            background: #4A76C5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            box-sizing: border-box;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-nav {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            background: #2E69F2;
            font-family: inherit;
            font-size: 16px;
        }

        .btn-nav:hover {
            background: #1e56d4;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            padding: 40px;
            max-width: 1300px;
            width: 95%;
            justify-content: center;
        }

        .giaodien,
        .danh-sach-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .giaodien {
            width: 400px;
            flex-shrink: 0;
        }

        .danh-sach-container {
            flex-grow: 1;
            padding: 20px;
            min-width: 600px;
        }

        #ghi,
        th {
            background: #4A76C5;
            color: white;
            padding: 12px;
            font-weight: bold;
            text-align: center;
        }

        .form-content {
            padding: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td,
        th {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        input,
        select {
            width: 100%;
            height: 38px;
            border: 1px solid #aaa;
            padding: 5px 10px;
            font-family: inherit;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: #4A76C5;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-family: inherit;
            font-size: 16px;
            border-radius: 4px;
        }

        .btn-main:hover {
            background: #3a5fa3;
        }

        .btn-save {
            background: #28a745;
            display: none;
            float: right;
            width: auto;
            padding: 10px 30px;
            margin-top: 15px;
        }

        .fee-text {
            color: #d32f2f;
            font-weight: bold;
        }

        #qrCode {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div style="font-weight: bold; font-size: 24px;">Quản lý bãi xe</div>
        <div class="nav-buttons">
            <button class="btn-nav" onclick="location.href='main.html'">Trang chủ</button>
            <button class="btn-nav" onclick="location.href='checkout.html'">Xe ra</button>
            <button class="btn-nav" onclick="location.href='baocao.html'">Báo cáo</button>
            <button class="btn-nav" onclick="thoat()">Đăng xuất</button>
        </div>
    </div>

    <div class="container">
        <div class="giaodien">
            <div id="ghi">GHI NHẬN XE VÀO</div>
            <div class="form-content">
                <table>

                    <tr>
                        <td>3 số cuối</td>
                        <td><input type="text" id="soCuoi" placeholder="Ví dụ: 123"></td>
                    </tr>
                    <tr>
                        <td>Loại xe</td>
                        <td>
                            <select id="loaiXe">
                                <option value="Xe máy">Xe máy</option>
                                <option value="Ô tô">Ô tô</option>
                            </select>
                        </td>
                    <tr>
                        <td style="text-align: left;">Giờ vào</td>
                        <td><input type="datetime-local" id="tgVao"></td>
                    </tr>
                    </tr>
                </table>
                <button class="btn-main" onclick="ghiNhan()">Ghi nhận (Enter)</button>
                <div id="qrCode"></div>
            </div>
        </div>

    </div>
    <div class="danh-sach-container">
        <div
            style="color:#4A76C5; font-weight: bold; margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #4A76C5; padding-bottom: 5px; text-align: left;">
            Danh sách xe chờ lưu
        </div>
        <table id="tableDanhSach">
            <thead>
                <tr>

                    <th>Loại xe</th>
                    <th>Thời gian</th>
                    <th>Tiền phí</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button id="btnSave" class="btn-main btn-save" onclick="saveToDB()">Lưu tất cả vào Database</button>
    </div>
    </div>
    <script>
        const $ = id => document.getElementById(id);
        let danhSachXeChoLuu = [];


        async function ghiNhan() {
            const sc = document.getElementById('soCuoi').value;
            const lx = document.getElementById('loaiXe').value;
            if (!sc) return alert("Vui lòng nhập 3 số cuối!");

            const res = await fetch('http://localhost:3000/api/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ soCuoi: sc, mauXe: lx })
            });

            const data = await res.json();
            if (data.success) {
                alert("Ghi nhận thành công! Mã vé: " + data.maVe);
                // Xóa mã QR cũ nếu có và vẽ mới
                document.getElementById("qrCode").innerHTML = "";
                new QRCode(document.getElementById("qrCode"), data.maVe);
            } else {
                alert(data.message);
            }
        }
        // Lưu Database (Gửi thêm soCuoi lên server)
        async function saveToDB() {
            const API_URL = "http://localhost:3000/api/checkin";
            for (const xe of danhSachXeChoLuu) {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(xe)
                });
            }
            alert("Lưu thành công!");
            danhSachXeChoLuu = [];
        }
    </script>
</body>

</html>
